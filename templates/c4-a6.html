roup{display:flex;flex-direction:column;gap:9px;flex:0 0 auto}.source-title{font:11px ui-monospace,monospace;color:#F4F0E8}.info-sheet{width:105mm;background:#fff;color:#111;padding:8mm;display:flex;flex-direction:column;gap:4mm}.info-sheet.wide{width:148mm;padding:11mm}.info-sheet.ink{background:#111;color:#fff}.info-label{font-size:8pt;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:#0253D6}.ink .info-label{color:#F0C464}.info-sheet h2,.info-sheet h3{margin:0;font-weight:800;text-transform:uppercase;letter-spacing:-.02em}.info-sheet h2{font-size:27pt;line-height:.88}.info-sheet h3{font-size:15pt;line-height:1}.info-sheet p{margin:0;font-size:9pt;line-height:1.45}.rail{display:flex;gap:4mm;border-top:1px solid #DCDCDC;padding-top:2mm}.rail-label{font-size:7pt;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#0253D6;flex:0 0 28mm}.rail-copy{font-size:9pt;line-height:1.35;flex:1}.ink .rail{border-color:rgba(255,255,255,.25)}.ink .rail-label{color:#F0C464}.plain-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;width:100%}.plain-card{background:#F4F0E8;color:#111;padding:24px;border-top:6px solid #0253D6;min-height:185px}.plain-card h3{margin:0;font-size:19px;text-transform:uppercase}.plain-card p{margin:12px 0 0;font-size:15px;line-height:1.4}.flow-sheet{width:148mm;background:#fff;color:#111;padding:11mm;display:flex;flex-direction:column}.flow-row{display:grid;grid-template-columns:12mm 38mm 1fr;gap:4mm;padding:2.5mm 0;border-bottom:1px solid #DCDCDC;align-items:baseline}.flow-row:last-child{border-bottom:0}.flow-row b,.flow-row span{font-size:7.5pt;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#0253D6}.flow-row p{margin:0;font-size:9pt;line-height:1.35}.decision-sheet{width:105mm;background:#0253D6;color:#fff;padding:8mm;display:flex;flex-direction:column;gap:3mm}.decision-sheet .info-label,.decision-sheet h3{color:#F0C464}.decision-sheet h3{margin:0;font-size:15pt;text-transform:uppercase}.           <p style="margin:0;font-size:8.5pt;line-height:1.35;font-weight:450;max-width:80mm">Four-metre walls, mats underneath, and a route for every level. Turn up in comfortable clothes — we lend the shoes.</p>
